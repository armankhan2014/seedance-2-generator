# Hourly Postgres ‚Äö√ú√≠ R2 backup
#
# Runs every hour at :00 UTC. Dumps the Neon database with pg_dump,
# gzips it, uploads to your R2 bucket under db-backups/, then prunes
# old backups using a tiered retention policy.
#
# Retention:
#   - Hourly: every hourly dump from the last 48 hours (max 48 files)
#   - Daily:  the 00:00 UTC dump from each of the last 30 days
#   - Monthly: the 1st-of-month 00:00 UTC dump from the last 12 months
#
# Secrets required (Settings ‚Äö√ú√≠ Secrets and variables ‚Äö√ú√≠ Actions):
#   DATABASE_URL          - Postgres connection string from Neon
#   R2_ACCOUNT_ID         - Cloudflare account ID
#   R2_ACCESS_KEY_ID      - R2 API token (read+write)
#   R2_SECRET_ACCESS_KEY  - R2 API token secret
#   R2_BUCKET_NAME        - R2 bucket to store backups in (can reuse the
#                           production bucket ‚Äö√Ñ√Æ backups go under db-backups/)
#
# Manual trigger: Actions tab ‚Äö√ú√≠ "Hourly DB Backup" ‚Äö√ú√≠ "Run workflow".

name: Hourly DB Backup

on:
  schedule:
    - cron: "0 * * * *"   # every hour at :00 UTC
  workflow_dispatch:       # allow manual runs

# This job needs no repo write access.
permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Install Postgres 17 client (must match Neon's server version)
        # 2026-06-09 ‚Äî Workflow has been failing hourly with the old
        # APT setup. ubuntu-latest moved to 24.04, which rejects the
        # legacy `gpg --dearmor ‚Üí /etc/apt/trusted.gpg.d/` pattern
        # plus the PostgreSQL project rotated their signing approach.
        # Switching to the official quickstart script the upstream
        # project documents:
        #   https://wiki.postgresql.org/wiki/Apt
        # apt.postgresql.org.sh registers the signed-by repo + key in
        # the modern location and stays self-updating across Ubuntu
        # version bumps.
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          # The -y flag suppresses the interactive "create main cluster" prompt.
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Compute backup timestamp
        id: ts
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%d-%H%M")
          echo "value=$TIMESTAMP" >> "$GITHUB_OUTPUT"

      - name: Dump database (with retry)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # Verbose + fail-fast + propagate failures through the pipe.
          set -euxo pipefail
          OUT="/tmp/db-${{ steps.ts.outputs.value }}.sql.gz"
          # Up to 3 attempts ‚Äî Neon can drop the connection mid-dump
          # if the compute scales down. Sleep between tries.
          for attempt in 1 2 3; do
            echo "::group::pg_dump attempt $attempt"
            if /usr/lib/postgresql/17/bin/pg_dump \
                 --no-owner --no-acl --clean --if-exists \
                 "$DATABASE_URL" | gzip -9 > "$OUT"; then
              echo "::endgroup::"
              break
            fi
            echo "::endgroup::"
            echo "Attempt $attempt failed, waiting before retry..."
            rm -f "$OUT"
            sleep $((attempt * 10))
            if [ "$attempt" = "3" ]; then
              echo "::error::pg_dump failed after 3 attempts"
              exit 1
            fi
          done
          ls -lh "$OUT"

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION:    auto
        run: |
          aws s3 cp \
            "/tmp/db-${{ steps.ts.outputs.value }}.sql.gz" \
            "s3://${{ secrets.R2_BUCKET_NAME }}/db-backups/db-${{ steps.ts.outputs.value }}.sql.gz" \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
            --no-progress

      - name: Prune old backups (48h hourly + 30d daily + 12mo monthly)
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION:    auto
          R2_ACCOUNT_ID:         ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME:        ${{ secrets.R2_BUCKET_NAME }}
        run: |
          python3 <<'PY'
          import os, re, subprocess
          from datetime import datetime, timezone, timedelta

          endpoint = f"https://{os.environ['R2_ACCOUNT_ID']}.r2.cloudflarestorage.com"
          bucket   = os.environ["R2_BUCKET_NAME"]
          prefix   = "db-backups/"

          out = subprocess.run(
              ["aws", "s3", "ls", f"s3://{bucket}/{prefix}",
               "--endpoint-url", endpoint],
              capture_output=True, text=True, check=True,
          ).stdout

          pattern = re.compile(r"db-(\d{4}-\d{2}-\d{2}-\d{4})\.sql\.gz$")
          files = []
          for line in out.splitlines():
              m = pattern.search(line)
              if m:
                  ts = datetime.strptime(m.group(1), "%Y-%m-%d-%H%M").replace(tzinfo=timezone.utc)
                  key = line.split()[-1]
                  files.append((ts, key))

          now = datetime.now(timezone.utc)
          hourly_cutoff  = now - timedelta(hours=48)
          daily_cutoff   = now - timedelta(days=30)
          monthly_cutoff = now - timedelta(days=365)

          keep, delete = [], []
          for ts, key in files:
              if ts > hourly_cutoff:
                  keep.append(key)
              elif ts > daily_cutoff and ts.hour == 0:
                  keep.append(key)
              elif ts > monthly_cutoff and ts.day == 1 and ts.hour == 0:
                  keep.append(key)
              else:
                  delete.append(key)

          print(f"Total dumps:    {len(files)}")
          print(f"Keeping:        {len(keep)}")
          print(f"Deleting:       {len(delete)}")
          for key in delete:
              print(f"  - {key}")
              subprocess.run(
                  ["aws", "s3", "rm", f"s3://{bucket}/{prefix}{key}",
                   "--endpoint-url", endpoint],
                  check=True,
              )
          PY

      - name: Summary
        if: always()
        run: |
          echo "::notice title=Backup complete::Stored db-backups/db-${{ steps.ts.outputs.value }}.sql.gz in R2 bucket ${{ secrets.R2_BUCKET_NAME }}"
